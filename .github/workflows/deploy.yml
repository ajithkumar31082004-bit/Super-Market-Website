name: SuperMarketPRO CI/CD

on:
  push:
    branches:
      - main

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Check Node.js syntax
        run: node --check backend/server.js

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Build Docker image
        run: docker build -t supermarket-app:${{ github.sha }} .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: supermarket-app:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  cd:
    name: Continuous Deployment
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 with rollback
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd ~/Super-Market-Website

            IMAGE_NAME="supermarket-app"
            NEW_IMAGE="${IMAGE_NAME}:${{ github.sha }}"
            OLD_IMAGE="${IMAGE_NAME}:previous"

            echo "Pulling latest source code..."
            git pull origin main

            echo "Saving current image for rollback..."

            if docker image inspect ${IMAGE_NAME}:latest >/dev/null 2>&1; then
              docker tag ${IMAGE_NAME}:latest ${OLD_IMAGE}
            fi

            echo "Building new Docker image..."

            docker build -t ${NEW_IMAGE} .
            docker tag ${NEW_IMAGE} ${IMAGE_NAME}:latest

            echo "Stopping old container..."

            docker stop supermarket-app || true
            docker rm supermarket-app || true

            echo "Starting new container..."

            docker run -d \
              --name supermarket-app \
              --restart unless-stopped \
              -p 5000:5000 \
              ${NEW_IMAGE}

            echo "Waiting for application..."

            sleep 10

            echo "Running health check..."

            if curl --fail --silent http://localhost:5000/health; then

              echo ""
              echo "================================"
              echo "DEPLOYMENT SUCCESSFUL"
              echo "================================"

            else

              echo ""
              echo "================================"
              echo "DEPLOYMENT FAILED"
              echo "Starting rollback..."
              echo "================================"

              docker logs supermarket-app || true

              docker stop supermarket-app || true
              docker rm supermarket-app || true

              docker run -d \
                --name supermarket-app \
                --restart unless-stopped \
                -p 5000:5000 \
                ${OLD_IMAGE}

              sleep 10

              curl --fail http://localhost:5000/health

              echo ""
              echo "================================"
              echo "ROLLBACK SUCCESSFUL"
              echo "================================"

              exit 1
            fi

            echo "Running containers..."

            docker ps