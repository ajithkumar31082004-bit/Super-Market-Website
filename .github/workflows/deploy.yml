cd:
  name: Continuous Deployment
  needs: ci
  runs-on: ubuntu-latest

  steps:
    - name: Deploy to EC2 with rollback
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          set -e

          cd ~/Super-Market-Website

          IMAGE_NAME="supermarket-app"
          NEW_IMAGE="${IMAGE_NAME}:${{ github.sha }}"
          OLD_IMAGE="${IMAGE_NAME}:previous"

          echo "================================"
          echo "Pulling latest source code"
          echo "================================"

          git pull origin main

          echo "================================"
          echo "Saving current image for rollback"
          echo "================================"

          if docker image inspect ${IMAGE_NAME}:latest >/dev/null 2>&1; then
            docker tag ${IMAGE_NAME}:latest ${OLD_IMAGE}
          fi

          echo "================================"
          echo "Building new Docker image"
          echo "================================"

          docker build -t ${NEW_IMAGE} .
          docker tag ${NEW_IMAGE} ${IMAGE_NAME}:latest

          echo "================================"
          echo "Stopping old container"
          echo "================================"

          docker stop supermarket-app || true
          docker rm supermarket-app || true

          echo "================================"
          echo "Starting new container"
          echo "================================"

          docker run -d \
            --name supermarket-app \
            --restart unless-stopped \
            -p 5000:5000 \
            ${NEW_IMAGE}

          echo "================================"
          echo "Waiting for health check"
          echo "================================"

          sleep 10

          echo "================================"
          echo "Checking application health"
          echo "================================"

          if curl --fail --silent http://localhost:5000/health; then
            echo ""
            echo "================================"
            echo "DEPLOYMENT SUCCESSFUL ✅"
            echo "================================"
          else
            echo ""
            echo "================================"
            echo "DEPLOYMENT FAILED ❌"
            echo "Starting rollback..."
            echo "================================"

            docker logs supermarket-app || true

            docker stop supermarket-app || true
            docker rm supermarket-app || true

            docker run -d \
              --name supermarket-app \
              --restart unless-stopped \
              -p 5000:5000 \
              ${OLD_IMAGE}

            sleep 10

            curl --fail http://localhost:5000/health

            echo ""
            echo "================================"
            echo "ROLLBACK SUCCESSFUL ✅"
            echo "================================"

            exit 1
          fi

          echo "================================"
          echo "Running containers"
          echo "================================"

          docker ps