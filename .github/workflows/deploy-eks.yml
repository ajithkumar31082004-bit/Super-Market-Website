name: Deploy to Amazon EKS (CI/CD Pipeline)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Docker, Push to ECR, Deploy to EKS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.AWS_ECR_REPOSITORY || 'supermarket-app' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Docker image..."
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          
          echo "Pushing Docker image to Amazon ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Install kubectl & Update EKS Kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME || 'supermarket-eks-cluster' }} --region ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Deploy Kubernetes Manifests to Amazon EKS
        run: |
          echo "Applying ConfigMap & Secrets..."
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml
          
          echo "Applying Service & Ingress (AWS ALB)..."
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml
          
          echo "Deploying Application to Amazon EKS..."
          kubectl apply -f k8s/deployment.yaml
          kubectl set image deployment/supermarket-deployment supermarket-container=${{ env.IMAGE_URI }} --record
          
          echo "Checking Deployment Rollout Status..."
          kubectl rollout status deployment/supermarket-deployment --timeout=180s
