apiVersion: v1
kind: ServiceAccount
metadata:
  name: supermarket-service-account
  namespace: supermarket
  labels:
    app: supermarket-app
  annotations:
    # IRSA: links this K8s ServiceAccount to the AWS IAM role for pod-level AWS access
    # Replace <ACCOUNT_ID> with your AWS account ID after terraform apply
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/supermarket-app-pod-role
