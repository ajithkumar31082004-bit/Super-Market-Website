apiVersion: v1
kind: Secret
metadata:
  name: supermarket-secrets
  namespace: supermarket
  labels:
    app: supermarket-app
type: Opaque
# NOTE: With IRSA, AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY are NOT needed.
# Pods automatically inherit credentials from the IRSA IAM role.
# Only application-level secrets are stored here.
stringData:
  DB_PASSWORD: "YOUR_RDS_DB_PASSWORD"
  JWT_SECRET: "YOUR_JWT_SECRET_KEY"
  GEMINI_API_KEY: "YOUR_GEMINI_API_KEY"
