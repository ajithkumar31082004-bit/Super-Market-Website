apiVersion: apps/v1
kind: Deployment
metadata:
  name: supermarket-deployment
  namespace: default
  labels:
    app: supermarket-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: supermarket-app
  template:
    metadata:
      labels:
        app: supermarket-app
    spec:
      containers:
        - name: supermarket-container
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/supermarket-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: supermarket-config
            - secretRef:
                name: supermarket-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
