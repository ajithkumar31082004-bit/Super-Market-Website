<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SuperMarket Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-bg {
            background: linear-gradient(rgba(22, 163, 74, 0.9), rgba(5, 150, 105, 0.9)),
                        url('https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80');
            background-size: cover;
            background-position: center;
        }
        .auth-card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
        }
        .tab-active {
            background: #16a34a;
            color: white;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center auth-bg">
    <div class="container mx-auto px-4">
        <div class="max-w-md mx-auto">
            <!-- Logo -->
            <div class="text-center mb-8">
                <a href="index.html" class="inline-flex items-center space-x-3">
                    <div class="bg-white text-green-600 p-3 rounded-lg">
                        <i class="fas fa-shopping-cart text-3xl"></i>
                    </div>
                    <div class="text-left">
                        <h1 class="text-3xl font-bold text-white">Super<span class="text-yellow-300">Market</span>Pro</h1>
                        <p class="text-white/80">Fresh groceries delivered</p>
                    </div>
                </a>
            </div>

            <!-- Tabs -->
            <div class="flex bg-white rounded-full p-1 mb-8">
                <button id="loginTab" 
                        class="flex-1 py-3 rounded-full font-semibold tab-active">
                    <i class="fas fa-sign-in-alt mr-2"></i>Login
                </button>
                <button id="signupTab" 
                        class="flex-1 py-3 rounded-full font-semibold">
                    <i class="fas fa-user-plus mr-2"></i>Sign Up
                </button>
            </div>

            <!-- Login Form -->
            <div id="loginForm" class="auth-card rounded-2xl p-8 shadow-2xl">
                <h2 class="text-2xl font-bold mb-6">Welcome Back!</h2>
                
                <form id="loginFormElement" class="space-y-6">
                    <div>
                        <label class="block mb-2 font-semibold">Email Address</label>
                        <input type="email" 
                               id="loginEmail" 
                               required
                               class="w-full p-3 border rounded-lg focus:outline-none focus:border-green-500"
                               placeholder="your@email.com">
                    </div>
                    
                    <div>
                        <label class="block mb-2 font-semibold">Password</label>
                        <input type="password" 
                               id="loginPassword" 
                               required
                               class="w-full p-3 border rounded-lg focus:outline-none focus:border-green-500"
                               placeholder="••••••••">
                    </div>
                    
                    <div class="flex justify-between items-center">
                        <label class="flex items-center">
                            <input type="checkbox" class="mr-2">
                            <span class="text-sm">Remember me</span>
                        </label>
                        <a href="#" class="text-green-600 hover:text-green-700 text-sm">Forgot password?</a>
                    </div>
                    
                    <button type="submit" 
                            class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-lg font-semibold">
                        <i class="fas fa-sign-in-alt mr-2"></i>Login to Account
                    </button>
                    
                    <!-- Quick Demo Role Logins -->
                    <div class="mt-6 pt-4 border-t border-gray-100">
                        <p class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 text-center">Quick Demo Logins</p>
                        <div class="grid grid-cols-3 gap-2">
                            <button type="button" onclick="fillDemoLogin('admin@supermarket.com', 'admin123')" class="px-2 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-800 text-xs font-semibold rounded-lg transition text-center">
                                <i class="fas fa-user-shield text-green-600 block mb-0.5"></i> Admin
                            </button>
                            <button type="button" onclick="fillDemoLogin('staff@supermarket.com', 'staff123')" class="px-2 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-800 text-xs font-semibold rounded-lg transition text-center border border-blue-200">
                                <i class="fas fa-id-badge text-blue-600 block mb-0.5"></i> Staff
                            </button>
                            <button type="button" onclick="fillDemoLogin('customer@example.com', 'user123')" class="px-2 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 text-xs font-semibold rounded-lg transition text-center border border-emerald-200">
                                <i class="fas fa-user text-emerald-600 block mb-0.5"></i> Customer
                            </button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Signup Form -->
            <div id="signupForm" class="auth-card rounded-2xl p-8 shadow-2xl hidden">
                <h2 class="text-2xl font-bold mb-6">Create Account</h2>
                
                <form id="signupFormElement" class="space-y-6">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block mb-2 font-semibold">First Name</label>
                            <input type="text" 
                                   id="firstName" 
                                   required
                                   class="w-full p-3 border rounded-lg focus:outline-none focus:border-green-500">
                        </div>
                        <div>
                            <label class="block mb-2 font-semibold">Last Name</label>
                            <input type="text" 
                                   id="lastName" 
                                   required
                                   class="w-full p-3 border rounded-lg focus:outline-none focus:border-green-500">
                        </div>
                    </div>
                    
                    <div>
                        <label class="block mb-2 font-semibold">Email Address</label>
                        <input type="email" 
                               id="signupEmail" 
                               required
                               class="w-full p-3 border rounded-lg focus:outline-none focus:border-green-500">
                    </div>
                    
                    <div>
                        <label class="block mb-2 font-semibold">Phone Number</label>
                        <input type="tel" 
                               id="phone" 
                               required
                               class="w-full p-3 border rounded-lg focus:outline-none focus:border-green-500">
                    </div>
                    
                    <div>
                        <label class="block mb-2 font-semibold">Password</label>
                        <input type="password" 
                               id="signupPassword" 
                               required
                               class="w-full p-3 border rounded-lg focus:outline-none focus:border-green-500">
                        <div class="text-xs text-gray-500 mt-1">At least 8 characters with letters and numbers</div>
                    </div>
                    
                    <div>
                        <label class="block mb-2 font-semibold">Confirm Password</label>
                        <input type="password" 
                               id="confirmPassword" 
                               required
                               class="w-full p-3 border rounded-lg focus:outline-none focus:border-green-500">
                    </div>
                    
                    <div>
                        <label class="flex items-start">
                            <input type="checkbox" required class="mr-3 mt-1">
                            <span class="text-sm">
                                I agree to the <a href="#" class="text-green-600">Terms & Conditions</a> and 
                                <a href="#" class="text-green-600">Privacy Policy</a>
                            </span>
                        </label>
                    </div>
                    
                    <button type="submit" 
                            class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-lg font-semibold">
                        <i class="fas fa-user-plus mr-2"></i>Create Account
                    </button>
                </form>
            </div>

            <!-- Back to home -->
            <div class="text-center mt-6">
                <a href="index.html" class="text-white hover:text-yellow-300">
                    <i class="fas fa-arrow-left mr-2"></i>Back to Home
                </a>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/ai-assistant.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginTab = document.getElementById('loginTab');
            const signupTab = document.getElementById('signupTab');
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const loginFormElement = document.getElementById('loginFormElement');
            const signupFormElement = document.getElementById('signupFormElement');

            // Tab switching
            function switchTab(tab) {
                if (tab === 'login') {
                    loginTab.classList.add('tab-active');
                    signupTab.classList.remove('tab-active');
                    loginForm.classList.remove('hidden');
                    signupForm.classList.add('hidden');
                } else {
                    signupTab.classList.add('tab-active');
                    loginTab.classList.remove('tab-active');
                    signupForm.classList.remove('hidden');
                    loginForm.classList.add('hidden');
                }
            }

            loginTab.addEventListener('click', () => switchTab('login'));
            signupTab.addEventListener('click', () => switchTab('signup'));

            // Login form submission
            loginFormElement.addEventListener('submit', async function(e) {
                e.preventDefault();
                const email = document.getElementById('loginEmail').value.trim();
                const password = document.getElementById('loginPassword').value;
                
                if (!email || !password) {
                    alert('Please fill in all fields');
                    return;
                }

                // Call Auth class (handles Express API + LocalStorage fallback)
                const result = await auth.login(email, password);

                if (result.success) {
                    if (result.user.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else if (result.user.role === 'staff') {
                        window.location.href = 'staff-dashboard.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                } else {
                    alert(result.message || 'Invalid email or password');
                }
            });

            // Signup form submission
            signupFormElement.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const firstName = document.getElementById('firstName').value.trim();
                const lastName = document.getElementById('lastName').value.trim();
                const email = document.getElementById('signupEmail').value.trim();
                const phone = document.getElementById('phone').value.trim();
                const password = document.getElementById('signupPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                
                if (!firstName || !lastName || !email || !phone || !password || !confirmPassword) {
                    alert('Please fill in all fields');
                    return;
                }
                
                if (password !== confirmPassword) {
                    alert('Passwords do not match');
                    return;
                }
                
                if (password.length < 6) {
                    alert('Password must be at least 6 characters');
                    return;
                }

                const result = await auth.register({
                    firstName,
                    lastName,
                    email,
                    phone,
                    password
                });

                if (result.success) {
                    alert('Account created successfully!');
                    window.location.href = 'index.html';
                } else {
                    alert(result.message || 'Registration failed');
                }
            });

            // Fill demo logins
            window.fillDemoLogin = function(email, pass) {
                switchTab('login');
                document.getElementById('loginEmail').value = email;
                document.getElementById('loginPassword').value = pass;
            };
        });
    </script>
</body>
</html>
